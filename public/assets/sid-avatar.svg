<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Illustration of Sid: a smiling man with short spiky black hair, light stubble and a blue hoodie" xmlns:c2pa="http://c2pa.org/manifest">
